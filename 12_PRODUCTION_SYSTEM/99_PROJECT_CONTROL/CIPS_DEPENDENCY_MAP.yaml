# =============================================================================
#
# CIPS DEPENDENCY MAP
#
# Official Dependency Graph
#
# =============================================================================

document:

  name: CIPS_DEPENDENCY_MAP.yaml

  official_name: Official Dependency Graph

  version: 2.0.0

  status: ACTIVE

  type: PROJECT_CONTROL

  authority: Production Architecture Board

# =============================================================================
# PROJECT
# =============================================================================

project:

  name: ConsejoIA_V5

  codename: CIPS Production Operating System

  target_version: 1.0.0

# =============================================================================
# PURPOSE
# =============================================================================

purpose:

  description: >
    Define the official dependency graph of the entire Production Operating
    System.

  objectives:

    - Detect dependency violations

    - Prevent circular dependencies

    - Build dependency graph

    - Enable impact analysis

    - Enable automatic validation

    - Support Engineering Intelligence

# =============================================================================
# DEPENDENCY PRINCIPLES
# =============================================================================

principles:

  single_source_of_truth: true

  acyclic_graph: true

  explicit_dependencies: true

  dependency_injection_only: true

  interface_first: true

  layered_architecture: true

  no_hidden_dependencies: true

# =============================================================================
# DEPENDENCY TYPES
# =============================================================================

dependency_types:

  HARD:

    description: >
      Mandatory dependency.

  SOFT:

    description: >
      Optional dependency.

  RUNTIME:

    description: >
      Runtime dependency.

  DEVELOPMENT:

    description: >
      Development dependency.

  KNOWLEDGE:

    description: >
      Engineering Knowledge dependency.

# =============================================================================
# ROOT NODES
# =============================================================================

root_nodes:

  constitution:

    description: >
      Constitutional documents.

  project_control:

    description: >
      Project Control System.

  developer_tools:

    description: >
      Internal engineering tools.

  production_os:

    description: >
      Production Operating System.

# =============================================================================
# DEPENDENCY LAYERS
# =============================================================================

layers:

  layer_0:

    name: Constitutional Layer

  layer_1:

    name: Project Control Layer

  layer_2:

    name: Engineering Knowledge Layer

  layer_3:

    name: Developer Tool Layer

  layer_4:

    name: Production Layer

# =============================================================================
# GRAPH RULES
# =============================================================================

graph_rules:

  upward_dependencies: forbidden

  circular_dependencies: forbidden

  hidden_dependencies: forbidden

  duplicated_dependencies: forbidden

  interface_skipping: forbidden

# =============================================================================
# END OF PART I
# =============================================================================
# =============================================================================
# DEPENDENCY MODEL
# =============================================================================

dependency_model:

  graph_type: DAG

  directed: true

  acyclic: true

  transitive_dependencies: explicit

  dependency_resolution: deterministic

# =============================================================================
# DEPENDENCY HIERARCHY
# =============================================================================

hierarchy:

  level_0:

    id: constitution

    description: >
      Constitutional documents.

    dependencies: []

  level_1:

    id: project_control

    description: >
      Project Control System.

    dependencies:

      - constitution

  level_2:

    id: engineering_knowledge

    description: >
      Engineering Knowledge System.

    dependencies:

      - constitution

      - project_control

  level_3:

    id: developer_tools

    description: >
      Developer Tool Suite.

    dependencies:

      - constitution

      - project_control

      - engineering_knowledge

  level_4:

    id: production_os

    description: >
      Production Operating System.

    dependencies:

      - constitution

      - project_control

      - engineering_knowledge

      - developer_tools

# =============================================================================
# PROJECT SUBSYSTEMS
# =============================================================================

subsystems:

  technical_constitution:

    layer: level_0

    dependency_type: HARD

  project_control:

    layer: level_1

    dependency_type: HARD

  engineering_knowledge:

    layer: level_2

    dependency_type: HARD

  developer_tools:

    layer: level_3

    dependency_type: HARD

  production_os:

    layer: level_4

    dependency_type: HARD

# =============================================================================
# DEPENDENCY DIRECTION
# =============================================================================

dependency_direction:

  constitution:

    may_depend_on: []

    may_be_used_by:

      - project_control

      - engineering_knowledge

      - developer_tools

      - production_os

  project_control:

    may_depend_on:

      - constitution

    may_be_used_by:

      - engineering_knowledge

      - developer_tools

      - production_os

  engineering_knowledge:

    may_depend_on:

      - constitution

      - project_control

    may_be_used_by:

      - developer_tools

      - production_os

  developer_tools:

    may_depend_on:

      - constitution

      - project_control

      - engineering_knowledge

    may_be_used_by:

      - production_os

  production_os:

    may_depend_on:

      - constitution

      - project_control

      - engineering_knowledge

      - developer_tools

    may_be_used_by: []

# =============================================================================
# DEPENDENCY CONSTRAINTS
# =============================================================================

constraints:

  circular_dependency_detection: true

  duplicate_dependency_detection: true

  orphan_node_detection: true

  unreachable_node_detection: true

  invalid_reference_detection: true

  layer_violation_detection: true

# =============================================================================
# GRAPH VALIDATION
# =============================================================================

validation:

  graph_connected: required

  dag_validation: required

  root_nodes_present: required

  layer_integrity: required

  dependency_integrity: required

  topological_sort: required

# =============================================================================
# DEPENDENCY INHERITANCE
# =============================================================================

inheritance:

  enabled: true

  explicit_override_required: true

  inherited_constraints:

    - architecture_rules

    - interface_contracts

    - dependency_rules

    - validation_rules

# =============================================================================
# END OF PART II
# =============================================================================
# =============================================================================
# GRAPH NODES
# =============================================================================

nodes:

  constitutional_layer:

    id: L0

    name: Constitutional Layer

    type: ROOT

    dependencies: []

    children:

      - architecture

      - architecture_rules

      - technical_specifications

      - implementation_roadmap

  project_control_layer:

    id: L1

    name: Project Control Layer

    type: CONTROL

    dependencies:

      - constitutional_layer

    children:

      - master_roadmap

      - current_state

      - delivery_ledger

      - engineering_knowledge

      - dependency_map

      - file_manifest

      - session_handoff

      - acceptance_matrix

      - checkpoints

  engineering_knowledge_layer:

    id: L2

    name: Engineering Knowledge Layer

    type: KNOWLEDGE

    dependencies:

      - constitutional_layer

      - project_control_layer

    children:

      - knowledge_base

      - engineering_patterns

      - engineering_standards

      - lessons_learned

      - anti_patterns

  developer_tools_layer:

    id: L3

    name: Developer Tool Suite

    type: TOOLING

    dependencies:

      - constitutional_layer

      - project_control_layer

      - engineering_knowledge_layer

    children:

      - bootstrap

      - validators

      - analyzers

      - generators

      - dashboards

      - reporting

      - metrics

      - cli

  production_layer:

    id: L4

    name: Production Operating System

    type: PRODUCT

    dependencies:

      - constitutional_layer

      - project_control_layer

      - engineering_knowledge_layer

      - developer_tools_layer

# =============================================================================
# NODE TYPES
# =============================================================================

node_types:

  ROOT:

    description: >
      Root node of the dependency graph.

  CONTROL:

    description: >
      Governs project execution.

  KNOWLEDGE:

    description: >
      Preserves engineering knowledge.

  TOOLING:

    description: >
      Provides engineering automation.

  PRODUCT:

    description: >
      Delivers business value.

# =============================================================================
# EDGE RULES
# =============================================================================

edges:

  relationship_types:

    - depends_on

    - implements

    - validates

    - references

    - generates

    - consumes

    - extends

    - certifies

  direction:

    parent_to_child: allowed

    child_to_parent: forbidden

    peer_to_peer: explicit_only

# =============================================================================
# DEPENDENCY RESOLUTION
# =============================================================================

resolution:

  strategy: topological_sort

  execution_order:

    - constitutional_layer

    - project_control_layer

    - engineering_knowledge_layer

    - developer_tools_layer

    - production_layer

  deterministic: true

# =============================================================================
# IMPACT ANALYSIS
# =============================================================================

impact_analysis:

  enabled: true

  analyze:

    - upstream_dependencies

    - downstream_dependencies

    - affected_documents

    - affected_modules

    - affected_deliverables

    - affected_tests

    - affected_validations

# =============================================================================
# GRAPH INTEGRITY
# =============================================================================

integrity:

  orphan_nodes: forbidden

  isolated_nodes: forbidden

  duplicated_nodes: forbidden

  circular_paths: forbidden

  broken_edges: forbidden

  invalid_layers: forbidden

# =============================================================================
# FUTURE GRAPH EXTENSIONS
# =============================================================================

future_extensions:

  reserved:

    - document_graph

    - knowledge_graph

    - contract_graph

    - interface_graph

    - runtime_graph

    - provider_graph

    - event_graph

    - asset_graph

  status: RESERVED_FOR_FUTURE_RELEASE

