# =============================================================================
# ARCHITECTURAL DEPENDENCY BOUNDARIES
# =============================================================================

architectural_boundaries:

  production_os:

    may_import_from:
      - core
      - contracts
      - interfaces
      - registry
      - configuration
      - event_bus
      - runtime
      - asset_management

    may_not_import_from:
      - project_control_documents
      - developer_tool_implementations
      - test_fixtures
      - temporary_scripts

  developer_tools:

    may_read:
      - constitutional_documents
      - project_control_documents
      - engineering_knowledge
      - source_code
      - tests
      - configuration

    may_modify:
      - derived_reports
      - generated_artifacts
      - approved_project_control_updates

    may_not_modify_without_authorization:
      - constitutional_documents
      - protected_legacy_files
      - accepted_contracts
      - accepted_interfaces

  project_control:

    may_reference:
      - all_project_entities

    may_execute_business_logic: false

  engineering_knowledge:

    may_reference:
      - architecture
      - specifications
      - roadmap
      - deliverables
      - modules
      - tests
      - incidents
      - risks

    may_execute_business_logic: false

# =============================================================================
# CHANGE IMPACT PROPAGATION
# =============================================================================

change_impact_propagation:

  constitutional_change:
    severity: CRITICAL
    requires:
      - architecture_review
      - approved_change_request
      - new_document_version
      - dependency_graph_revalidation
      - roadmap_impact_analysis
      - full_regression_review

  contract_change:
    severity: HIGH
    requires:
      - consumer_discovery
      - compatibility_analysis
      - interface_review
      - contract_tests
      - dependent_module_revalidation

  interface_change:
    severity: HIGH
    requires:
      - implementation_discovery
      - provider_compatibility_review
      - integration_tests
      - dependent_module_revalidation

  configuration_change:
    severity: MEDIUM
    requires:
      - schema_validation
      - profile_resolution_tests
      - policy_validation

  implementation_change:
    severity: VARIABLE
    requires:
      - affected_test_discovery
      - dependency_impact_analysis
      - targeted_regression_tests

# =============================================================================
# GRAPH AUTOMATION TARGETS
# =============================================================================

graph_automation_targets:

  phase_0:
    capabilities:
      - yaml_validation
      - unique_identifier_validation
      - missing_reference_detection
      - cycle_detection
      - topological_sort

  phase_1:
    capabilities:
      - repository_graph_generation
      - module_import_analysis
      - file_dependency_analysis
      - protected_file_impact_analysis

  phase_2:
    capabilities:
      - typed_graph_models
      - dependency_contracts
      - graph_result_models

  future:
    capabilities:
      - contract_graph
      - interface_graph
      - event_graph
      - provider_graph
      - asset_graph
      - knowledge_graph
      - meta_dependency_graph

# =============================================================================
# ACCEPTANCE GATE
# =============================================================================

acceptance_gate:

  deliverable_id: CTRL-006

  required_checks:
    - yaml_syntax_valid
    - no_duplicate_top_level_keys
    - all_deliverable_ids_unique
    - all_phase_ids_unique
    - all_references_resolve
    - no_self_dependencies
    - no_cycles
    - topological_sort_succeeds
    - current_state_matches_dependency_map
    - roadmap_order_matches_graph
    - accepted_deliverables_have_accepted_dependencies
    - pending_deliverables_do_not_unlock_active_work
    - future_proposals_are_marked_non_active

  expected_result:
    status: PASS
    errors: 0
    critical_warnings: 0

  current_status: READY_FOR_REVIEW

