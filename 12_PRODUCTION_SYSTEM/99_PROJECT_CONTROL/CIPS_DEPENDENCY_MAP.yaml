# =============================================================================
# VALIDATION RULES
# =============================================================================

dependency_validation_rules:

  identifiers:
    unique: true
    non_empty: true
    pattern_validation: true

  references:
    must_exist: true
    self_reference_forbidden: true

  graph:
    cycles_forbidden: true
    disconnected_deliverables_forbidden: true
    orphan_deliverables_forbidden: true
    topological_sort_required: true

  roadmap:
    deliverables_must_exist_in_roadmap: true
    phases_must_exist_in_roadmap: true
    execution_order_must_match_roadmap: true

  status:
    valid_values:
      - PENDING
      - READY
      - IN_PROGRESS
      - BLOCKED
      - IMPLEMENTED
      - TESTED
      - ACCEPTED
      - REJECTED
      - SUPERSEDED
      - DEPRECATED

  acceptance:
    accepted_dependencies_required_before_start: true
    next_deliverable_must_be_unlocked: true

