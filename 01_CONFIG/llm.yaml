# =========================================================
# CIPS
# LLM Provider Framework
# Release 0.5
# =========================================================

version: "1.1"

# ---------------------------------------------------------
# CONFIGURACIÓN ACTIVA DEL RUNTIME
# ---------------------------------------------------------

runtime:

  # Gemini queda seleccionado, pero desactivado durante
  # la preparación inicial. Mientras enabled sea false,
  # CIPS seguirá utilizando el proveedor manual.

  mode: automatic
  provider: gemini
  model: gemini-3.5-flash
  enabled: true

  timeout_seconds: 120
  temperature: 0.2
  max_output_tokens: 8192

  provider_options: {}


# ---------------------------------------------------------
# PROVEEDORES DISPONIBLES
# ---------------------------------------------------------

providers:

  ollama:

    enabled: true

    description: >
      Proveedor local gratuito corriendo mediante Ollama en tu equipo.

    options:
      base_url: "http://localhost:11434/v1"
      model: llama3:8b
      temperature: 0.7
      timeout_seconds: 120

  manual:

    enabled: true

    description: >
      CIPS genera el prompt y espera que el usuario obtenga
      la respuesta mediante una herramienta externa de IA.

    options: {}


  gemini:

    enabled: true

    description: >
      Proveedor automático Google Gemini mediante el SDK
      oficial google-genai.

    options:

      model: gemini-3.5-flash

      # La credencial se obtiene desde una variable de entorno.
      # Nunca escribir la clave directamente en este archivo.

      api_key_env: GOOGLE_API_KEY

      temperature: 0.2
      max_output_tokens: 8192
      timeout_seconds: 120
      thinking_level: low


  openai:

    enabled: true

    description: >
      Proveedor automático OpenAI mediante el SDK oficial, con
      timeout explícito y reintentos administrados por CIPS.

    options:
      model: gpt-5
      api_key_env: OPENAI_API_KEY
      temperature: 0.2
      max_output_tokens: 4000
      timeout_seconds: 120


  claude:

    enabled: false

    description: >
      Proveedor Anthropic Claude pendiente de implementación.

    options: {}


# ---------------------------------------------------------
# PREFERENCIAS POR STAGE
# ---------------------------------------------------------

stage_preferences:
  investigacion:
    provider: gemini
    model: gemini-3.5-flash
  verificacion:
    provider: gemini
    model: gemini-3.5-flash
  ideas:
    provider: gemini
    model: gemini-3.5-flash
  guion:
    provider: gemini
    model: gemini-3.5-flash
  storyboard:
    provider: gemini
    model: gemini-3.5-flash
  narracion:
    provider: gemini
    model: gemini-3.5-flash
  prompts_imagen:
    provider: gemini
    model: gemini-3.5-flash
  prompts_video:
    provider: gemini
    model: gemini-3.5-flash
  seo:
    provider: gemini
    model: gemini-3.5-flash
  publicacion:
    provider: gemini
    model: gemini-3.5-flash


# ---------------------------------------------------------
# POLÍTICA DE RESPALDO
# ---------------------------------------------------------

fallback:
  provider: manual
  use_manual_when:
    - automatic_mode_disabled
    - provider_not_registered
    - provider_disabled
    - missing_credentials
    - provider_error
